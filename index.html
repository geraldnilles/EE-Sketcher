<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>EE-Sketcher — Electrical Block Diagram Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <!-- ===== Toolbar (mode toggle) ===== -->
    <header id="toolbar" class="toolbar" aria-label="Mode selection">
      <h1 class="brand">EE-Sketcher</h1>
      <div class="mode-group" role="group" aria-label="Editor mode">
        <button type="button" class="mode-btn" data-mode="select"   title="Select / Edit (V)">Select / Edit</button>
        <button type="button" class="mode-btn" data-mode="drag"     title="Drag (D)">Drag</button>
        <button type="button" class="mode-btn" data-mode="connect"  title="Connect (C)">Connect</button>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="add-component-btn" title="Add Component (A)">+ Component</button>
        <button type="button" id="add-gnd-btn" title="Add GND (G)">+ GND</button>
      </div>
    </header>

    <!-- ===== Main: canvas + sidebar ===== -->
    <main class="main">
      <div class="canvas-wrap">
        <svg id="canvas"
             xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 1500 1000"
             preserveAspectRatio="xMidYMid meet"
             aria-label="Schematic canvas">
          <defs>
            <style>
/* Core Diagram Styles for Standalone Portability — static only */
.component-body {
  fill: #ffffff;
  stroke: #000000;
  stroke-width: 2;
  rx: 6px;
  ry: 6px;
}
.net-line {
  stroke: #000000;
  stroke-width: 2;
  stroke-linecap: square;
}
.junction {
  fill: #111827;
  stroke: #ffffff;
  stroke-width: 1.5;
}
            </style>

            <pattern id="grid-fine"  width="25" height="25" patternUnits="userSpaceOnUse">
              <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#e6e9ef" stroke-width="0.5"/>
            </pattern>
            <pattern id="grid-coarse" width="100" height="100" patternUnits="userSpaceOnUse">
              <rect width="100" height="100" fill="url(#grid-fine)"/>
              <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#c8cfdb" stroke-width="1"/>
            </pattern>
            <g id="gnd" data-pin1="0,0" class="component-body">
              <path d="M 0,0 V 10" fill="none"/>
              <path d="M -15,10 H 15 L 0,25 Z"/>
            </g>
          </defs>
          <!-- Background -->
          <rect x="0" y="0" width="1500" height="1000" fill="#fffff0" />

          <!-- Layer 0: grid overlay (non-interactive) -->
          <g class="grid-overlay" pointer-events="none">
            <rect x="0" y="0" width="1500" height="1000" fill="url(#grid-coarse)"/>
          </g>

          <!-- Layer 1: nets (lines) -->
          <g class="nets" id="nets-layer"></g>

          <!-- Layer 2: components (blocks) -->
          <g class="components" id="components-layer"></g>

          <!-- Layer 3: junctions (circles) -->
          <g class="junctions" id="junctions-layer" pointer-events="none"></g>

          <!-- Layer 4: transient overlays (preview, drag handles) -->
          <g class="overlay" id="overlay-layer" pointer-events="none"></g>
        </svg>
      </div>

      <aside id="sidebar" class="sidebar" aria-label="Inspector">
        <section class="panel" id="inspector-panel">
          <h2>Inspector</h2>
          <div id="inspector-body" class="panel-body">
            <p class="muted">Nothing selected.</p>
          </div>
        </section>

        <section class="panel data-portal">
          <h2>Data Portal</h2>
          <textarea id="data-portal" rows="10" spellcheck="false"
                    placeholder="Raw SVG schema appears here after export. Paste SVG and click Import to load."></textarea>
          <div class="data-portal-actions">
            <button type="button" id="export-btn">Export Schema</button>
            <button type="button" id="import-btn">Import Schema</button>
          </div>
          <p id="data-portal-msg" class="data-portal-msg" role="status" aria-live="polite"></p>
        </section>
      </aside>
    </main>
  </div>

  <!-- ===== Scripts (dependency order, all deferred) ===== -->
  <script src="js/state.js"          defer></script>
  <script src="js/viewport.js"       defer></script>
  <script src="js/components.js"     defer></script>
  <script src="js/nets.js"           defer></script>
  <script src="js/interactions.js"   defer></script>
  <script src="js/sidebar.js"        defer></script>
  <script src="js/serialization.js"  defer></script>
  <script src="js/main.js"           defer></script>
</body>
</html>
